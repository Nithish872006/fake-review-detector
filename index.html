<!DOCTYPE html>
<html>
<head>
    <title>Fake Review Detection</title>

    <style>

        body{
            background-color: #f2f2f2;
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        textarea{
            width: 400px;
            height: 120px;
            font-size: 18px;
        }

        button{
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        h1{
            color: darkblue;
        }

        h2{
            color: green;
        }

    </style>

</head>

<body>

    <h1>Fake Product Review Detection System</h1>

    <form method="POST">

        <textarea name="review"
        placeholder="Enter product review"></textarea>

        <br><br>

        <button type="submit">
            Check Review
        </button>

    </form>

    <h2>{{ prediction }}</h2>

</body>
</html>
